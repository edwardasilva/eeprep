name: Deploy

# A push to main deploys the dev site (the eeprep-dev Worker on workers.dev).
# A version tag, such as v1.0.0, deploys eeprep.com. A manual run picks either.
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options:
          - dev
          - production
        default: dev

permissions:
  contents: read

env:
  # engines.node is a range. setup-node cannot install that string from package.json.
  NODE_VERSION: '22.23.4'
  TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'dev') }}

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'dev') }}
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    outputs:
      wrangler-env: ${{ steps.target.outputs.wrangler-env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Pick the target
        id: target
        run: |
          if [ "$TARGET" = dev ]; then
            echo "SITE_ENV=dev" >> "$GITHUB_ENV"
            echo "wrangler-env=dev" >> "$GITHUB_OUTPUT"
          else
            echo "wrangler-env=" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npm run build
      - run: npm run check:robots
      - run: npm run test:worker
      - name: Check the Wrangler config
        env:
          WRANGLER_ENV: ${{ steps.target.outputs.wrangler-env }}
        run: npx wrangler deploy --dry-run --env="$WRANGLER_ENV"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist

  deploy:
    name: Deploy (${{ github.event_name == 'workflow_dispatch' && inputs.target || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'dev') }})
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    # The Cloudflare secrets live in this environment, so both targets use it.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.154.0
          command: deploy --env="${{ needs.build.outputs.wrangler-env }}"

  release:
    name: GitHub release
    needs: deploy
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
