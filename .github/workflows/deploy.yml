name: Deploy

# A push to main deploys the dev site (the eeprep-dev Worker on workers.dev).
# A version tag, such as v0.1.0, deploys eeprep.com. Tags are cut only when Edward says so.
# A manual run picks either.
# Docs-only and .github-only pushes to main skip this workflow. Site pages live
# under src/ as .md and .mdx, so those paths are not ignored. Path filters are
# not evaluated for tag pushes.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '.claude/**'
      - '*.md'
      - 'LICENSE'
      - 'LICENSE-CONTENT'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options:
          - dev
          - production
        default: dev

permissions:
  contents: read

env:
  TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'dev') }}

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.target || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'dev') }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      wrangler-env: ${{ steps.target.outputs.wrangler-env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache: the deploy builds what ships and must not restore a cache
      # that a pull request run could have written.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Pick the target
        id: target
        run: |
          if [ "$TARGET" = dev ]; then
            echo "SITE_ENV=dev" >> "$GITHUB_ENV"
            echo "wrangler-env=dev" >> "$GITHUB_OUTPUT"
          else
            echo "wrangler-env=" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist

  deploy:
    name: Deploy (${{ github.event_name == 'workflow_dispatch' && inputs.target || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'dev') }})
    needs: build
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Cloudflare secrets live in this environment, so both targets use it.
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Keep in step with wrangler in package.json, which the CI dry run uses.
          wranglerVersion: 4.158.0
          command: deploy --env="${{ needs.build.outputs.wrangler-env }}"

  release:
    name: GitHub release
    needs: deploy
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the release with generated notes, or keep an existing one
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # A release published by hand before this job runs already exists. This
        # workflow uploads no assets, so there is nothing to update in that case.
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists. No assets to upload, so it is left as it is."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          fi
