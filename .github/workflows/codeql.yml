# CodeQL cannot upload results while this repository is private.
# That failure would turn every pull request red.
# The analyze job skips while the repository is private. The check stays neutral.
# After the repository becomes public at launch, the job runs on its own.
#
# It runs weekly and by hand, not on every pull request or push. While the
# repository is private, a pull request run only added a skipped check.

name: CodeQL

'on':
  schedule:
    - cron: '31 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    if: ${{ !github.event.repository.private }}
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Uploads the scan results.
      security-events: write
      # Reads CodeQL query packs.
      packages: read
      # Reads workflow files in a private repository.
      actions: read
      # Checks out a private repository.
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          category: '/language:${{ matrix.language }}'
