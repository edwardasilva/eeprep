name: PR body

# The body check runs on its own so a synchronize does not restart the whole CI
# run. It no longer runs on edited, labeled, or unlabeled. Editing a PR body
# after open does not re-run this check; the next push will.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-body-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-body:
    name: PR body
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only the check script, not the whole repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Require an issue line
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
          PR_SENDER: ${{ github.actor }}
        run: node .github/scripts/check-pr-body.mjs
