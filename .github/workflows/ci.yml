name: CI

on:
  pull_request:
    branches:
      - main
      - epic/**

jobs:
  pr-body:
    name: PR body
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Require an epic issue line
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
          PR_SENDER: ${{ github.actor }}
        run: node scripts/check-pr-body.mjs

  build:
    name: Build and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run check:wikilinks
      - run: npm run check:figures
      - run: npm run build
      - run: npm run check:links

  vale:
    name: Vale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Vale 3.11.2
        run: |
          curl -sSL -o /tmp/vale.tar.gz https://github.com/errata-ai/vale/releases/download/v3.11.2/vale_3.11.2_Linux_64-bit.tar.gz
          tar -xzf /tmp/vale.tar.gz -C /tmp vale
          sudo mv /tmp/vale /usr/local/bin/vale
          vale --version
      - name: Lint guide prose
        run: vale src/content/docs
