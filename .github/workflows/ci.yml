name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  # engines.node is a range. setup-node cannot install that string from package.json.
  NODE_VERSION: '22.23.4'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-body:
    name: PR body
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require an issue line
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
          PR_SENDER: ${{ github.actor }}
        run: node .github/scripts/check-pr-body.mjs

  build:
    name: Build and links
    needs: [pr-body]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:wikilinks
      - run: npm run check:wikilinks
      - run: npm run test:citations
      - run: npm run check:citations
      - run: npm run check:dev
      - run: npm run test:sidebar
      - run: npm run build
      - run: npm run check:deploy
      - run: npm run check:deploy:dev
      - name: Deploy pins the same Wrangler as package.json
        run: |
          set -euo pipefail
          want="$(node -p "require('./package.json').devDependencies.wrangler")"
          if ! grep -Eq "^ +wranglerVersion: ${want//./\\.}$" .github/workflows/deploy.yml; then
            echo "deploy.yml wranglerVersion must be $want, the wrangler version in package.json." >&2
            exit 1
          fi
      - run: npm run check:robots
      - run: npm run test:worker
      - run: npm run check:links
      - run: npm run check:link-text
      - run: npm run test:link-index
      - run: npm run check:link-index
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 1

  mobile:
    name: Mobile audit
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check whether Mobile is needed
        id: paths
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          files="$(git diff --name-only "$base" HEAD)"
          if printf '%s\n' "$files" | grep -Eq \
            '^(src/|astro\.config\.|package(-lock)?\.json$|\.github/scripts/mobile-audit\.mjs$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.paths.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - if: steps.paths.outputs.run == 'true'
        run: npm ci
      - if: steps.paths.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Cache Playwright Chromium
        if: steps.paths.outputs.run == 'true'
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.paths.outputs.run == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.paths.outputs.run == 'true'
        run: npm run check:mobile

  lint:
    name: Lint
    needs: [pr-body]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  vale:
    name: Vale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Vale 3.25.1
        id: vale-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/vale-3.25.1
          key: vale-3.25.1-linux-x64
      - name: Install Vale 3.25.1
        if: steps.vale-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base=https://github.com/vale-cli/vale/releases/download/v3.25.1
          curl -fsSL -o /tmp/vale.tar.gz "$base/vale_3.25.1_Linux_64-bit.tar.gz"
          echo "4bf5c5176b682b1da0830f471584d3494f1c2e27ee3029e1ad6f6661d4962182  /tmp/vale.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/vale-3.25.1"
          tar -xzf /tmp/vale.tar.gz -C "$HOME/vale-3.25.1" vale
      - name: Put Vale on PATH
        run: |
          set -euo pipefail
          sudo cp "$HOME/vale-3.25.1/vale" /usr/local/bin/vale
          sudo chmod +x /usr/local/bin/vale
          vale --version
      - name: Lint guide prose
        run: vale --config .github/vale/.vale.ini src/content/docs
