name: Idea or suggestion
description: Suggest a page, a change, or an improvement.
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like, and why?
      description: Describe the change and the problem it solves.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page or link
      description: The page this is about, if there is one.
    validations:
      required: false
