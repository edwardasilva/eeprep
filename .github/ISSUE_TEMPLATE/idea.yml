name: Idea or suggestion
description: Suggest a page, a change, or an improvement.
body:
  - type: textarea
    id: idea
    attributes:
      label: Description
      description: What would you like, and why?
    validations:
      required: false
  - type: input
    id: page
    attributes:
      label: Page or link (optional)
      description: The page this is about, if there is one.
    validations:
      required: false
