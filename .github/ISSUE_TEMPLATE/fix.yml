name: Fix something
description: Report a mistake, a broken link, or something that does not work.
body:
  - type: input
    id: where
    attributes:
      label: Page URL or file
      description: For example, https://eeprep.com/advice/resume/ or src/content/docs/advice/resume/index.mdx.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong, and what should it say or do?
      description: Link a public source if the fix changes a fact.
    validations:
      required: true
