name: Epic
description: Propose a new epic branch and the pull requests inside it.
title: 'Epic: '
labels:
  - epic
body:
  - type: markdown
    attributes:
      value: |
        An epic uses a branch named epic/name.
        Small pull requests merge into that branch.
        The last pull request merges the epic into main.
  - type: input
    id: branch-name
    attributes:
      label: Branch name
      description: Use epic/name with lowercase letters and hyphens.
      placeholder: epic/name
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      description: Write the GitHub username of the person who owns this epic.
      placeholder: edwardasilva
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: State what this epic includes and what it leaves out.
    validations:
      required: true
  - type: textarea
    id: planned-prs
    attributes:
      label: Planned pull requests
      description: List each planned pull request as a task. Put one task on each line.
      value: |
        - [ ] Name this pull request
    validations:
      required: true
